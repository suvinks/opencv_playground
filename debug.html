<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCV Interactive Debug</title>
    
    <!-- External Libraries -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const SimpleTest = () => {
            const [showCode, setShowCode] = useState(false);
            const [showOCR, setShowOCR] = useState(false);
            
            return (
                <div className="grid-container">
                    {/* Header Logo Block */}
                    <div className="header-logo">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 bg-blue-600 rounded-lg flex items-center justify-center">
                                <span className="text-xl font-bold text-white">CV</span>
                            </div>
                            <div>
                                <h1 className="text-lg font-bold text-white">OpenCV Interactive</h1>
                                <p className="text-xs text-gray-400">Image Processing Tool</p>
                            </div>
                        </div>
                    </div>

                    {/* Header Action Buttons */}
                    <div className="header-actions">
                        <div className="flex items-center gap-4 w-full">
                            <button className="flex items-center gap-2 px-4 py-2 bg-blue-600 rounded hover:bg-blue-700 transition-colors flex-1">
                                Upload Image
                            </button>
                            <button className="flex items-center gap-2 px-4 py-2 bg-green-600 rounded hover:bg-green-700 transition-colors flex-1">
                                Download Result
                            </button>
                            <button 
                                onClick={() => setShowCode(!showCode)}
                                className="flex items-center gap-2 px-4 py-2 bg-purple-600 rounded hover:bg-purple-700 transition-colors flex-1"
                            >
                                {showCode ? 'Hide' : 'Show'} Code
                            </button>
                            <button 
                                onClick={() => setShowOCR(!showOCR)}
                                className="flex items-center gap-2 px-4 py-2 bg-indigo-600 rounded hover:bg-indigo-700 transition-colors flex-1"
                            >
                                {showOCR ? 'Hide' : 'View'} OCR
                            </button>
                        </div>
                    </div>

                    {/* Left Sidebar */}
                    <div className="app-sidebar">
                        <div className="panel-header p-4">
                            <h2 className="text-lg font-bold">Menu Items</h2>
                        </div>
                        <div className="panel-content flex-1 p-4">
                            <p className="text-gray-400">Functions will appear here</p>
                        </div>
                    </div>

                    {/* Center Content */}
                    <div className={`center-content ${
                        !showCode && !showOCR ? 'images-only' :
                        showCode && !showOCR ? 'images-code' :
                        !showCode && showOCR ? 'images-ocr' :
                        'images-code-ocr'
                    }`}>
                        {/* Images Area */}
                        <div className="images-area">
                            <div className="image-panel">
                                <div className="image-panel-header">
                                    <h3 className="text-sm font-semibold text-gray-400">Original</h3>
                                </div>
                                <div className="image-panel-content">
                                    <div className="text-gray-500 text-center">
                                        <p>Upload an image to get started</p>
                                    </div>
                                </div>
                            </div>
                            <div className="image-panel">
                                <div className="image-panel-header">
                                    <h3 className="text-sm font-semibold text-gray-400">Processed</h3>
                                </div>
                                <div className="image-panel-content">
                                    <div className="text-gray-500">No processing applied</div>
                                </div>
                            </div>
                        </div>

                        {/* Code Area */}
                        <div className={`code-area ${showCode ? '' : 'hidden'}`}>
                            <div className="panel-header p-4">
                                <h3 className="text-lg font-semibold">Python Code</h3>
                            </div>
                            <div className="panel-content flex-1 overflow-y-auto p-4">
                                <pre className="bg-gray-900 p-4 rounded text-sm text-green-400">
                                    <code>print("Hello OpenCV")</code>
                                </pre>
                            </div>
                        </div>

                        {/* OCR Area */}
                        <div className={`ocr-area ${showOCR ? '' : 'hidden'}`}>
                            <div className="panel-header p-4">
                                <h3 className="text-lg font-semibold">OCR Results</h3>
                            </div>
                            <div className="panel-content flex-1 overflow-y-auto p-4">
                                <div className="text-gray-500 text-sm">
                                    No OCR results yet.
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Right Column */}
                    <div className="right-column">
                        <div className="applied-functions-area">
                            <div className="panel-header p-4">
                                <h2 className="text-lg font-bold">Applied Functions</h2>
                            </div>
                            <div className="panel-content flex-1 p-4">
                                <div className="text-gray-500 text-sm text-center">
                                    No functions applied yet
                                </div>
                            </div>
                        </div>
                        <div className="function-properties-area">
                            <div className="panel-header p-4">
                                <h2 className="text-lg font-bold">Properties</h2>
                            </div>
                            <div className="panel-content flex-1 p-4">
                                <div className="text-gray-500 text-sm text-center">
                                    Select a function to view properties
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };
        
        ReactDOM.render(<SimpleTest />, document.getElementById('root'));
    </script>
</body>
</html>
