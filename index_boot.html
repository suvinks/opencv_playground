<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCV Interactive - Bootstrap Version</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23006E74'/><circle cx='8' cy='8' r='3' fill='%23004D52'/></svg>">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- External Libraries -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tesseract OCR Library with Fallback -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" 
            onerror="loadTesseractFallback()"></script>
    
    <script>
        // Fallback Tesseract loading function
        function loadTesseractFallback() {
            console.log('Primary Tesseract CDN failed, loading fallback...');
            const script = document.createElement('script');
            script.src = 'https://unpkg.com/tesseract.js@5/dist/tesseract.min.js';
            script.onerror = function() {
                console.error('All Tesseract CDNs failed to load');
                setTimeout(() => {
                    if (typeof Tesseract === 'undefined') {
                        document.body.innerHTML = `
                            <div class="container-fluid h-100 d-flex align-items-center justify-content-center">
                                <div class="text-center text-danger">
                                    <h2><i class="bi bi-exclamation-triangle"></i> OCR Library Loading Failed</h2>
                                    <p><strong>Quick Fixes:</strong></p>
                                    <ul class="list-unstyled">
                                        <li>Hard refresh: Ctrl+Shift+R (Win) or Cmd+Shift+R (Mac)</li>
                                        <li>Clear browser cache completely</li>
                                        <li>Check internet connection</li>
                                        <li>Try different browser (Chrome recommended)</li>
                                        <li>Disable VPN/firewall temporarily</li>
                                    </ul>
                                    <button onclick="location.reload()" class="btn btn-danger">
                                        <i class="bi bi-arrow-clockwise"></i> Reload Page
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                }, 2000);
            };
            document.head.appendChild(script);
        }
        
        // Check if Tesseract loaded after page loads
        window.addEventListener('load', function() {
            setTimeout(function() {
                if (typeof Tesseract === 'undefined') {
                    loadTesseractFallback();
                }
            }, 1000);
        });
    </script>
    
    <!-- Custom Bootstrap Theme -->
    <style>
        :root {
            --bs-primary: #006E74;
            --bs-primary-rgb: 0, 110, 116;
            --bs-secondary: #004D52;
            --bs-secondary-rgb: 0, 77, 82;
            --bs-dark: #003337;
            --bs-dark-rgb: 0, 51, 55;
            --bs-success: #008A94;
            --bs-success-rgb: 0, 138, 148;
            --bs-info: #00A5B1;
            --bs-info-rgb: 0, 165, 177;
            --bs-light: #00E6F7;
            --bs-light-rgb: 0, 230, 247;
        }

        body {
            background-color: var(--bs-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        }

        .bg-primary-dark {
            background-color: var(--bs-secondary) !important;
        }

        .bg-content {
            background-color: var(--bs-dark) !important;
        }

        .text-primary-light {
            color: var(--bs-light) !important;
        }

        .btn-primary {
            background-color: var(--bs-success);
            border-color: var(--bs-success);
        }

        .btn-primary:hover {
            background-color: var(--bs-info);
            border-color: var(--bs-info);
        }

        .border-primary-custom {
            border-color: var(--bs-primary) !important;
        }

        .border-success-custom {
            border-color: var(--bs-success) !important;
        }

        .image-panel {
            background-color: var(--bs-dark);
            border: 1px solid var(--bs-primary);
            border-radius: 0.375rem;
            transition: border-color 0.2s ease;
        }

        .image-panel:hover {
            border-color: var(--bs-success);
        }

        .function-card {
            background-color: var(--bs-primary);
            border: 1px solid var(--bs-success);
            transition: all 0.2s ease;
        }

        .function-card:hover {
            border-color: var(--bs-info);
            background-color: var(--bs-success);
        }

        .function-card.selected {
            border-color: var(--bs-light);
            background-color: var(--bs-secondary);
        }

        .scrollable-panel {
            max-height: 400px;
            overflow-y: auto;
        }

        .code-display {
            background-color: var(--bs-dark);
            border-radius: 0.375rem;
            font-family: 'Courier New', monospace;
            color: var(--bs-light);
        }

        .ocr-result {
            background-color: var(--bs-dark);
            border-radius: 0.375rem;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background-color: var(--bs-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background-color: var(--bs-success);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: var(--bs-info);
        }

        .progress {
            background-color: var(--bs-primary);
        }

        .progress-bar {
            background-color: var(--bs-light);
        }

        .collapse-btn {
            background: none;
            border: none;
            color: white;
            width: 100%;
            text-align: left;
            padding: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .collapse-btn:hover {
            background-color: var(--bs-primary);
            color: white;
        }

        .dragging {
            opacity: 0.7;
        }

        /* Responsive layout adjustments */
        @media (max-width: 768px) {
            .col-functions,
            .col-properties {
                max-height: 300px;
            }
        }
    </style>
</head>
<body class="text-white">
    <div id="root"></div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Application Script -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==================== BOOTSTRAP ICON COMPONENTS ====================
        const BootstrapIcon = ({ name, size = 16, className = "" }) => (
            <i className={`bi bi-${name} ${className}`} style={{ fontSize: size }}></i>
        );

        // Icon component wrappers for Bootstrap Icons
        const Plus = ({ size = 16 }) => <BootstrapIcon name="plus" size={size} />;
        const X = ({ size = 16 }) => <BootstrapIcon name="x" size={size} />;
        const Eye = ({ size = 16 }) => <BootstrapIcon name="eye" size={size} />;
        const EyeOff = ({ size = 16 }) => <BootstrapIcon name="eye-slash" size={size} />;
        const Upload = ({ size = 16 }) => <BootstrapIcon name="upload" size={size} />;
        const Download = ({ size = 16 }) => <BootstrapIcon name="download" size={size} />;
        const ChevronDown = ({ size = 16 }) => <BootstrapIcon name="chevron-down" size={size} />;
        const ChevronRight = ({ size = 16 }) => <BootstrapIcon name="chevron-right" size={size} />;
        const GripVertical = ({ size = 16 }) => <BootstrapIcon name="grip-vertical" size={size} />;
        const Code = ({ size = 16 }) => <BootstrapIcon name="code" size={size} />;
        const FileText = ({ size = 16 }) => <BootstrapIcon name="file-text" size={size} />;

        // ==================== OPENCV FUNCTION DEFINITIONS ====================
        const OPENCV_CATEGORIES = {
            'Blur & Smoothing': [
                {
                    id: 'gaussianBlur',
                    name: 'Gaussian Blur',
                    params: [
                        { name: 'ksize', label: 'Kernel Size', type: 'number', default: 5, min: 1, max: 31, step: 2 },
                        { name: 'sigmaX', label: 'Sigma X', type: 'number', default: 0, min: 0, max: 10, step: 0.1 }
                    ]
                },
                {
                    id: 'medianBlur',
                    name: 'Median Blur',
                    params: [
                        { name: 'ksize', label: 'Kernel Size', type: 'number', default: 5, min: 1, max: 31, step: 2 }
                    ]
                },
                {
                    id: 'bilateralFilter',
                    name: 'Bilateral Filter',
                    params: [
                        { name: 'd', label: 'Diameter', type: 'number', default: 9, min: 1, max: 20, step: 1 },
                        { name: 'sigmaColor', label: 'Sigma Color', type: 'number', default: 75, min: 0, max: 200, step: 1 },
                        { name: 'sigmaSpace', label: 'Sigma Space', type: 'number', default: 75, min: 0, max: 200, step: 1 }
                    ]
                }
            ],
            'Edge Detection': [
                {
                    id: 'canny',
                    name: 'Canny Edge Detection',
                    params: [
                        { name: 'threshold1', label: 'Threshold 1', type: 'number', default: 50, min: 0, max: 300, step: 1 },
                        { name: 'threshold2', label: 'Threshold 2', type: 'number', default: 150, min: 0, max: 300, step: 1 }
                    ]
                },
                {
                    id: 'sobel',
                    name: 'Sobel Edge Detection',
                    params: [
                        { name: 'dx', label: 'Order X', type: 'number', default: 1, min: 0, max: 2, step: 1 },
                        { name: 'dy', label: 'Order Y', type: 'number', default: 1, min: 0, max: 2, step: 1 }
                    ]
                }
            ],
            'Color & Transforms': [
                {
                    id: 'cvtColor',
                    name: 'Color Space Conversion',
                    params: [
                        { name: 'code', label: 'Conversion Type', type: 'select', default: 'COLOR_BGR2GRAY', options: [
                            { value: 'COLOR_BGR2GRAY', label: 'BGR to Grayscale' },
                            { value: 'COLOR_BGR2HSV', label: 'BGR to HSV' },
                            { value: 'COLOR_BGR2RGB', label: 'BGR to RGB' }
                        ]}
                    ]
                },
                {
                    id: 'threshold',
                    name: 'Threshold',
                    params: [
                        { name: 'thresh', label: 'Threshold Value', type: 'number', default: 127, min: 0, max: 255, step: 1 },
                        { name: 'maxval', label: 'Max Value', type: 'number', default: 255, min: 0, max: 255, step: 1 }
                    ]
                }
            ],
            'OCR': [
                {
                    id: 'tesseract',
                    name: 'Tesseract OCR',
                    params: [
                        { name: 'oem', label: 'OCR Engine Mode', type: 'select', default: 3, options: [
                            { value: 0, label: '0 - Original only' },
                            { value: 1, label: '1 - Neural nets LSTM only' },
                            { value: 2, label: '2 - Original + LSTM' },
                            { value: 3, label: '3 - Default (best available)' }
                        ]},
                        { name: 'psm', label: 'Page Segmentation', type: 'select', default: 6, options: [
                            { value: 6, label: '6 - Single uniform block' },
                            { value: 7, label: '7 - Single text line' },
                            { value: 8, label: '8 - Single word' },
                            { value: 10, label: '10 - Single character' },
                            { value: 13, label: '13 - Raw line (no formatting)' }
                        ]}
                    ]
                }
            ]
        };

        // Flatten all functions for easy lookup
        const OPENCV_FUNCTIONS = Object.values(OPENCV_CATEGORIES).flat();

        // ==================== CODE GENERATION ====================
        const generatePythonCode = (appliedFunctions) => {
            let code = "import cv2\nimport numpy as np\n\n";
            code += "# Load image\nimg = cv2.imread('input_image.jpg')\n\n";
            
            appliedFunctions.forEach((func, index) => {
                if (!func.enabled) return;
                
                code += `# ${func.name}\n`;
                
                switch (func.id) {
                    case 'gaussianBlur':
                        code += `img = cv2.GaussianBlur(img, (${func.params.ksize}, ${func.params.ksize}), ${func.params.sigmaX})\n`;
                        break;
                    case 'medianBlur':
                        code += `img = cv2.medianBlur(img, ${func.params.ksize})\n`;
                        break;
                    case 'bilateralFilter':
                        code += `img = cv2.bilateralFilter(img, ${func.params.d}, ${func.params.sigmaColor}, ${func.params.sigmaSpace})\n`;
                        break;
                    case 'canny':
                        code += `gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)\n`;
                        code += `img = cv2.Canny(gray, ${func.params.threshold1}, ${func.params.threshold2})\n`;
                        break;
                    case 'sobel':
                        code += `gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)\n`;
                        code += `img = cv2.Sobel(gray, cv2.CV_64F, ${func.params.dx}, ${func.params.dy}, ksize=3)\n`;
                        code += `img = np.uint8(np.absolute(img))\n`;
                        break;
                    case 'cvtColor':
                        code += `img = cv2.cvtColor(img, cv2.${func.params.code})\n`;
                        break;
                    case 'threshold':
                        code += `gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)\n`;
                        code += `_, img = cv2.threshold(gray, ${func.params.thresh}, ${func.params.maxval}, cv2.THRESH_BINARY)\n`;
                        break;
                    case 'tesseract':
                        code += `# OCR processing will be done on the final processed image\n`;
                        code += `# OCR Engine Mode: ${func.params.oem}, Page Segmentation: ${func.params.psm}\n`;
                        break;
                }
                code += "\n";
            });
            
            code += "# Save result\ncv2.imwrite('output_image.jpg', img)\n";
            code += "cv2.waitKey(0)\ncv2.destroyAllWindows()";
            
            return code;
        };

        // ==================== MAIN COMPONENT ====================
        const OpenCVInteractiveBootstrap = () => {
            const [appliedFunctions, setAppliedFunctions] = useState([]);
            const [selectedFunction, setSelectedFunction] = useState(null);
            const [originalImage, setOriginalImage] = useState(null);
            const [processedImage, setProcessedImage] = useState(null);
            const [showCode, setShowCode] = useState(false);
            const [showOCR, setShowOCR] = useState(false);
            const [ocrResult, setOCRResult] = useState('');
            const [ocrProgress, setOCRProgress] = useState(0);
            const [opencvReady, setOpencvReady] = useState(false);
            const [expandedCategories, setExpandedCategories] = useState({});
            const [draggedIndex, setDraggedIndex] = useState(null);
            
            const fileInputRef = useRef(null);

            // Load OpenCV
            useEffect(() => {
                const script = document.createElement('script');
                script.src = 'https://docs.opencv.org/4.8.0/opencv.js';
                script.onload = () => {
                    if (window.cv) {
                        setOpencvReady(true);
                        console.log('OpenCV loaded successfully');
                    }
                };
                document.body.appendChild(script);
                
                return () => {
                    document.body.removeChild(script);
                };
            }, []);

            // Process image when functions change
            useEffect(() => {
                if (originalImage && opencvReady) {
                    processImage();
                }
            }, [appliedFunctions, originalImage, opencvReady]);

            // OCR processing
            useEffect(() => {
                const hasTesseract = appliedFunctions.some(f => f.id === 'tesseract' && f.enabled);
                if (processedImage && hasTesseract) {
                    performOCR();
                } else {
                    setOCRResult('');
                }
            }, [processedImage, appliedFunctions]);

            const handleImageUpload = (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            setOriginalImage(img);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            const processImage = () => {
                if (!originalImage || !opencvReady) return;

                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = originalImage.width;
                    canvas.height = originalImage.height;
                    ctx.drawImage(originalImage, 0, 0);

                    let src = window.cv.imread(canvas);
                    let dst = new window.cv.Mat();

                    for (const func of appliedFunctions) {
                        if (!func.enabled) continue;

                        switch (func.id) {
                            case 'gaussianBlur':
                                const ksize = new window.cv.Size(func.params.ksize, func.params.ksize);
                                window.cv.GaussianBlur(src, dst, ksize, func.params.sigmaX);
                                src.delete();
                                src = dst.clone();
                                break;
                            case 'medianBlur':
                                window.cv.medianBlur(src, dst, func.params.ksize);
                                src.delete();
                                src = dst.clone();
                                break;
                            case 'bilateralFilter':
                                window.cv.bilateralFilter(src, dst, func.params.d, func.params.sigmaColor, func.params.sigmaSpace);
                                src.delete();
                                src = dst.clone();
                                break;
                            case 'canny':
                                window.cv.cvtColor(src, dst, window.cv.COLOR_RGBA2GRAY);
                                window.cv.Canny(dst, src, func.params.threshold1, func.params.threshold2);
                                dst.delete();
                                dst = src.clone();
                                break;
                            case 'sobel':
                                window.cv.cvtColor(src, dst, window.cv.COLOR_RGBA2GRAY);
                                window.cv.Sobel(dst, src, window.cv.CV_8U, func.params.dx, func.params.dy, 3);
                                dst.delete();
                                dst = src.clone();
                                break;
                            case 'cvtColor':
                                if (func.params.code === 'COLOR_BGR2GRAY') {
                                    window.cv.cvtColor(src, dst, window.cv.COLOR_RGBA2GRAY);
                                } else if (func.params.code === 'COLOR_BGR2HSV') {
                                    window.cv.cvtColor(src, dst, window.cv.COLOR_RGBA2HSV);
                                }
                                src.delete();
                                src = dst.clone();
                                break;
                            case 'threshold':
                                window.cv.cvtColor(src, dst, window.cv.COLOR_RGBA2GRAY);
                                window.cv.threshold(dst, src, func.params.thresh, func.params.maxval, window.cv.THRESH_BINARY);
                                dst.delete();
                                dst = src.clone();
                                break;
                        }
                    }

                    window.cv.imshow(canvas, dst);
                    setProcessedImage(canvas.toDataURL());

                    src.delete();
                    dst.delete();
                } catch (error) {
                    console.error('Error processing image:', error);
                }
            };

            const performOCR = async () => {
                if (!processedImage) return;

                const tesseractFunc = appliedFunctions.find(f => f.id === 'tesseract' && f.enabled);
                if (!tesseractFunc) return;

                try {
                    setOCRProgress(0);
                    const worker = await Tesseract.createWorker('eng');
                    
                    await worker.setParameters({
                        tessedit_ocr_engine_mode: tesseractFunc.params.oem,
                        tessedit_pageseg_mode: tesseractFunc.params.psm,
                    });

                    const { data: { text } } = await worker.recognize(processedImage, {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                setOCRProgress(m.progress * 100);
                            }
                        }
                    });

                    setOCRResult(text);
                    setOCRProgress(100);
                    await worker.terminate();
                } catch (error) {
                    console.error('OCR Error:', error);
                    setOCRResult('OCR processing failed. Please try again.');
                    setOCRProgress(0);
                }
            };

            const addFunction = (func) => {
                const params = {};
                func.params.forEach(param => {
                    params[param.name] = param.default;
                });
                
                const newFunc = {
                    id: func.id,
                    name: func.name,
                    params: params,
                    enabled: true
                };
                
                setAppliedFunctions([...appliedFunctions, newFunc]);
                setSelectedFunction(appliedFunctions.length);
            };

            const removeFunction = (index) => {
                const updated = appliedFunctions.filter((_, i) => i !== index);
                setAppliedFunctions(updated);
                if (selectedFunction === index) {
                    setSelectedFunction(null);
                }
            };

            const toggleFunction = (index) => {
                const updated = [...appliedFunctions];
                updated[index].enabled = !updated[index].enabled;
                setAppliedFunctions(updated);
            };

            const updateParameter = (funcIndex, paramName, value) => {
                const updated = [...appliedFunctions];
                updated[funcIndex].params[paramName] = parseFloat(value) || value;
                setAppliedFunctions(updated);
            };

            const toggleCategory = (category) => {
                setExpandedCategories(prev => ({
                    ...prev,
                    [category]: !prev[category]
                }));
            };

            const downloadImage = () => {
                if (processedImage) {
                    const link = document.createElement('a');
                    link.download = 'processed_image.png';
                    link.href = processedImage;
                    link.click();
                }
            };

            const selectedFuncDef = selectedFunction !== null 
                ? OPENCV_FUNCTIONS.find(f => f.id === appliedFunctions[selectedFunction].id)
                : null;

            const pythonCode = generatePythonCode(appliedFunctions);

            return (
                <div className="container-fluid h-100">
                    {/* Header */}
                    <div className="row bg-primary-dark border-bottom border-primary-custom">
                        <div className="col-md-3 col-lg-2 p-3 border-end border-primary-custom">
                            <div className="d-flex align-items-center gap-2">
                                <div className="bg-success rounded p-2 d-flex align-items-center justify-content-center" style={{width: '40px', height: '40px'}}>
                                    <span className="fw-bold text-white">CV</span>
                                </div>
                                <div>
                                    <h5 className="mb-0 text-white">OpenCV Playground</h5>
                                    <small className="text-white-50">Bootstrap Version</small>
                                </div>
                            </div>
                        </div>
                        <div className="col-md-9 col-lg-10 p-3">
                            <div className="row g-2">
                                <div className="col-6 col-md-3">
                                    <input
                                        ref={fileInputRef}
                                        type="file"
                                        accept="image/*"
                                        onChange={handleImageUpload}
                                        className="d-none"
                                    />
                                    <button
                                        onClick={() => fileInputRef.current?.click()}
                                        className="btn btn-primary w-100"
                                    >
                                        <Upload size={16} className="me-1" />
                                        Upload
                                    </button>
                                </div>
                                <div className="col-6 col-md-3">
                                    <button
                                        onClick={downloadImage}
                                        disabled={!processedImage}
                                        className="btn btn-success w-100"
                                    >
                                        <Download size={16} className="me-1" />
                                        Download
                                    </button>
                                </div>
                                <div className="col-6 col-md-3">
                                    <button
                                        onClick={() => setShowCode(!showCode)}
                                        className="btn btn-info w-100"
                                    >
                                        <Code size={16} className="me-1" />
                                        {showCode ? 'Hide' : 'Show'} Code
                                    </button>
                                </div>
                                <div className="col-6 col-md-3">
                                    <button
                                        onClick={() => setShowOCR(!showOCR)}
                                        disabled={!appliedFunctions.some(f => f.id === 'tesseract')}
                                        className="btn btn-warning w-100"
                                    >
                                        <FileText size={16} className="me-1" />
                                        {showOCR ? 'Hide' : 'View'} OCR
                                    </button>
                                </div>
                            </div>
                            {!opencvReady && (
                                <div className="mt-2">
                                    <small className="text-warning">
                                        <i className="bi bi-hourglass-split"></i> Loading OpenCV...
                                    </small>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="row h-100">
                        {/* Left Sidebar - Function Categories */}
                        <div className="col-md-3 col-lg-2 bg-primary-dark border-end border-primary-custom p-0">
                            <div className="bg-secondary p-3 border-bottom border-primary-custom">
                                <h6 className="mb-0 text-white">Function Toolbar</h6>
                            </div>
                            <div className="scrollable-panel p-2">
                                {Object.entries(OPENCV_CATEGORIES).map(([category, functions]) => (
                                    <div key={category} className="mb-2">
                                        <button
                                            onClick={() => toggleCategory(category)}
                                            className="collapse-btn bg-primary rounded"
                                            data-bs-toggle="collapse"
                                            data-bs-target={`#category-${category.replace(/\s+/g, '-')}`}
                                        >
                                            <span className="small fw-semibold">{category}</span>
                                            {expandedCategories[category] ? 
                                                <ChevronDown size={14} /> : 
                                                <ChevronRight size={14} />
                                            }
                                        </button>
                                        <div className={`collapse ${expandedCategories[category] ? 'show' : ''}`} id={`category-${category.replace(/\s+/g, '-')}`}>
                                            <div className="mt-1 ms-2">
                                                {functions.map(func => (
                                                    <div
                                                        key={func.id}
                                                        className="d-flex align-items-center justify-content-between p-2 mb-1 bg-content rounded"
                                                    >
                                                        <small className="text-white">{func.name}</small>
                                                        <button
                                                            onClick={() => addFunction(func)}
                                                            className="btn btn-primary btn-sm"
                                                            title="Add function"
                                                        >
                                                            <Plus size={12} />
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Center Content */}
                        <div className="col-md-6 col-lg-7 p-0">
                            {/* Images Row */}
                            <div className="row g-1 h-50">
                                <div className="col-6">
                                    <div className="image-panel h-100 d-flex flex-column">
                                        <div className="bg-primary-dark p-2 border-bottom border-primary-custom text-center">
                                            <h6 className="mb-0 text-white">Original</h6>
                                        </div>
                                        <div className="flex-grow-1 d-flex align-items-center justify-content-center p-3">
                                            {originalImage ? (
                                                <img 
                                                    src={originalImage.src} 
                                                    alt="Original" 
                                                    className="img-fluid"
                                                    style={{maxHeight: '100%', maxWidth: '100%', objectFit: 'contain'}}
                                                />
                                            ) : (
                                                <div className="text-center text-white-50">
                                                    <Upload size={48} className="mb-2 opacity-50" />
                                                    <p className="small">Upload an image to get started</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                                <div className="col-6">
                                    <div className="image-panel h-100 d-flex flex-column">
                                        <div className="bg-primary-dark p-2 border-bottom border-primary-custom text-center">
                                            <h6 className="mb-0 text-white">Processed</h6>
                                        </div>
                                        <div className="flex-grow-1 d-flex align-items-center justify-content-center p-3">
                                            {processedImage ? (
                                                <img 
                                                    src={processedImage} 
                                                    alt="Processed" 
                                                    className="img-fluid"
                                                    style={{maxHeight: '100%', maxWidth: '100%', objectFit: 'contain'}}
                                                />
                                            ) : originalImage ? (
                                                <div className="text-white-50 small">Apply functions to see results</div>
                                            ) : (
                                                <div className="text-white-50 small">No processing applied</div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Code Area */}
                            {showCode && (
                                <div className="bg-content border-top border-primary-custom" style={{height: '25%'}}>
                                    <div className="bg-primary-dark p-2 border-bottom border-primary-custom d-flex justify-content-between align-items-center">
                                        <h6 className="mb-0 text-white">Python Code</h6>
                                        <button
                                            onClick={() => {
                                                navigator.clipboard.writeText(pythonCode);
                                                alert('Code copied to clipboard!');
                                            }}
                                            className="btn btn-primary btn-sm"
                                        >
                                            <i className="bi bi-clipboard"></i> Copy
                                        </button>
                                    </div>
                                    <div className="p-3 h-100 overflow-auto">
                                        <pre className="code-display p-3 h-100 overflow-auto small">
                                            <code>{pythonCode}</code>
                                        </pre>
                                    </div>
                                </div>
                            )}

                            {/* OCR Area */}
                            {showOCR && (
                                <div className="bg-content border-top border-primary-custom" style={{height: '25%'}}>
                                    <div className="bg-primary-dark p-2 border-bottom border-primary-custom">
                                        <h6 className="mb-0 text-white">
                                            <span className="badge bg-info me-2">OCR</span>
                                            Tesseract Results
                                        </h6>
                                    </div>
                                    <div className="p-3 h-100 overflow-auto">
                                        {ocrProgress > 0 && ocrProgress < 100 && (
                                            <div className="mb-3">
                                                <div className="progress">
                                                    <div 
                                                        className="progress-bar" 
                                                        style={{width: `${ocrProgress}%`}}
                                                    ></div>
                                                </div>
                                                <small className="text-white-50">Processing: {ocrProgress.toFixed(1)}%</small>
                                            </div>
                                        )}
                                        {ocrResult ? (
                                            <div className="ocr-result p-3 text-white small">
                                                {ocrResult}
                                            </div>
                                        ) : (
                                            <div className="text-white-50 small">
                                                No OCR results yet. Make sure Tesseract is enabled and an image is uploaded.
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Right Sidebar */}
                        <div className="col-md-3 col-lg-3 bg-primary-dark border-start border-primary-custom p-0">
                            {/* Applied Functions */}
                            <div className="col-functions h-50">
                                <div className="bg-secondary p-3 border-bottom border-primary-custom">
                                    <h6 className="mb-0 text-white">Applied Functions</h6>
                                </div>
                                <div className="scrollable-panel p-2">
                                    {appliedFunctions.length === 0 ? (
                                        <div className="text-center text-white-50 p-4">
                                            <small>No functions applied yet<br />Drag to reorder</small>
                                        </div>
                                    ) : (
                                        appliedFunctions.map((func, index) => (
                                            <div
                                                key={index}
                                                className={`function-card p-2 mb-2 rounded cursor-pointer ${
                                                    selectedFunction === index ? 'selected' : ''
                                                } ${draggedIndex === index ? 'dragging' : ''}`}
                                                onClick={() => setSelectedFunction(index)}
                                            >
                                                <div className="d-flex align-items-center justify-content-between mb-1">
                                                    <div className="d-flex align-items-center gap-1">
                                                        {func.id !== 'tesseract' && <GripVertical size={12} className="text-white-50" />}
                                                        {func.id === 'tesseract' && <FileText size={12} className="text-primary-light" />}
                                                        <small className="text-white fw-medium">{func.name}</small>
                                                        {func.id === 'tesseract' && (
                                                            <span className="badge bg-info">OCR</span>
                                                        )}
                                                    </div>
                                                    <div className="d-flex gap-1">
                                                        <button
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                toggleFunction(index);
                                                            }}
                                                            className="btn btn-sm border-0 p-1"
                                                            title={func.enabled ? 'Disable' : 'Enable'}
                                                        >
                                                            {func.enabled ? <Eye size={12} /> : <EyeOff size={12} />}
                                                        </button>
                                                        <button
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                removeFunction(index);
                                                            }}
                                                            className="btn btn-sm btn-outline-danger border-0 p-1"
                                                            title="Remove"
                                                        >
                                                            <X size={12} />
                                                        </button>
                                                    </div>
                                                </div>
                                                <div className="small text-white-50">
                                                    {func.enabled ? 'Active' : 'Disabled'}
                                                    {func.id === 'tesseract' && ' • Processes final image'}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                            {/* Function Properties */}
                            <div className="col-properties h-50 border-top border-primary-custom">
                                <div className="bg-secondary p-3 border-bottom border-primary-custom">
                                    <h6 className="mb-0 text-white">Function Properties</h6>
                                </div>
                                <div className="scrollable-panel p-3">
                                    {selectedFunction !== null && selectedFuncDef ? (
                                        <>
                                            <h6 className="text-primary-light mb-3">
                                                {appliedFunctions[selectedFunction].name}
                                            </h6>
                                            {selectedFuncDef.params.length === 0 ? (
                                                <div className="small text-white-50">
                                                    No parameters for this function
                                                </div>
                                            ) : (
                                                <div className="vstack gap-3">
                                                    {selectedFuncDef.params.map(param => (
                                                        <div key={param.name}>
                                                            <label className="form-label small text-white-50 mb-1">
                                                                {param.label}
                                                            </label>
                                                            {param.type === 'select' ? (
                                                                <select
                                                                    value={appliedFunctions[selectedFunction].params[param.name]}
                                                                    onChange={(e) => updateParameter(selectedFunction, param.name, e.target.value)}
                                                                    className="form-select form-select-sm bg-content border-success-custom text-white"
                                                                >
                                                                    {param.options.map(opt => (
                                                                        <option key={opt.value} value={opt.value}>{opt.label}</option>
                                                                    ))}
                                                                </select>
                                                            ) : (
                                                                <input
                                                                    type={param.type}
                                                                    value={appliedFunctions[selectedFunction].params[param.name]}
                                                                    onChange={(e) => updateParameter(selectedFunction, param.name, e.target.value)}
                                                                    min={param.min}
                                                                    max={param.max}
                                                                    step={param.step}
                                                                    className="form-control form-control-sm bg-content border-success-custom text-white"
                                                                />
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </>
                                    ) : (
                                        <div className="text-center text-white-50 small">
                                            Select a function to view its properties
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Check Tesseract availability on app load
        window.addEventListener('load', function() {
            setTimeout(function() {
                if (typeof Tesseract === 'undefined') {
                    console.error('Tesseract failed to load - OCR will not work');
                } else {
                    console.log('✅ Tesseract loaded successfully');
                }
            }, 2000);
        });

        ReactDOM.render(<OpenCVInteractiveBootstrap />, document.getElementById('root'));
    </script>
</body>
</html>
